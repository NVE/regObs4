@if (!subTitle) {
  <ion-grid class="header-grid ion-no-padding ion-no-margin">
    <ion-row>
      <ion-col size="6" class="ion-no-padding">
        <h3 class="ion-text-uppercase">{{ title() | translate }}</h3>
      </ion-col>
      @if (showDayNames) {
        <ion-col size="6" class="ion-no-padding ion-align-self-end">
          <div *ngTemplateOutlet="dayNames"></div>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
}
@if (subTitle) {
  <ion-grid class="header-grid ion-no-margin ion-no-padding">
    <ion-row>
      <h3 class="ion-text-uppercase">{{ title() | translate }}</h3>
    </ion-row>
    <ion-row>
      <ion-label class="ion-text-wrap" color="medium">
        {{ subTitle() | translate }}
      </ion-label>
    </ion-row>
    <ion-row>
      @if (showDayNames) {
        <ion-col offset="6" size="6" class="ion-no-padding ion-align-self-end">
          <div *ngTemplateOutlet="dayNames"></div>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
}
<ng-template #dayNames>
  <ion-grid class="dayNames ion-no-padding">
    <ion-row>
      <ion-col class="ion-text-center">
        {{ getDayName(0) | translate }}
      </ion-col>
      <ion-col class="ion-text-center">
        {{ getDayName(1) | translate }}
      </ion-col>
      <ion-col class="ion-text-center">
        {{ getDayName(2) | translate }}
      </ion-col>
    </ion-row>
  </ion-grid>
</ng-template>
