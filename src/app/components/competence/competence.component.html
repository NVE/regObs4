<a target="_blank" [href]="userCompetenceUrl()" class="competence-wrapper">
  @if (starCount(); as starCount) {
    @for (index of [0, 1, 2, 3, 4]; track index) {
      @if (starCount <= index) {
        <svg-icon src="/assets/icon/star.svg"></svg-icon>
      } @else {
        <svg-icon src="/assets/icon/star.svg" class="filledStar"></svg-icon>
      }
    }
  } @else {
    <ion-label class="small-text">
      {{ "COMPETENCE.UNKNOWN" | translate }}
    </ion-label>
  }
</a>
