<ion-item [lines]="obsLocMode() ? 'none' : undefined">
  <ion-label [color]="labelColor()" position="stacked" [ngClass]="{ 'ion-text-uppercase': !obsLocMode() }">
    {{ label() | translate }}
  </ion-label>
  <app-select
    *ngIf="selectOptions() as options"
    [(selectedValue)]="value"
    [options]="options"
    [disabled]="disabled()"
    [label]="label()"
    [showReset]="showResetButton()"
    [class]="{ 'obs-loc-mode-select': obsLocMode() }"
  ></app-select>
</ion-item>
