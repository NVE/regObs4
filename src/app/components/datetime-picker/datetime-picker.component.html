<ion-datetime-button [datetime]="id">
  @if (!dateTime()) {
    <span slot="date-target">-</span>
    <span slot="time-target">-</span>
  }
</ion-datetime-button>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime
      [(ngModel)]="dateTime"
      [id]="id"
      [locale]="language()"
      [max]="maxDate()"
      [preferWheel]="preferWheel"
      [showDefaultButtons]="true"
      [firstDayOfWeek]="1"
      [doneText]="'DIALOGS.OK' | translate"
      [cancelText]="'DIALOGS.CANCEL' | translate"
      [presentation]="presentation()"
      [formatOptions]="{
        date: dateFormat(),
        time: timeFormat(),
      }"
      [showClearButton]="resetable()"
      [clearText]="'DIALOGS.RESET' | translate"
    >
      <span slot="time-label">{{ "REGISTRATION.SET_TIME.TITLE" | translate }}</span>
    </ion-datetime>
  </ng-template>
</ion-modal>
