@if (!(fullscreen$ | async)) {
  <ion-header>
    <ion-toolbar appHeaderColor>
      <ion-buttons slot="start">
        <ion-button (click)="cancel()">{{ "DIALOGS.CANCEL" | translate }}</ion-button>
      </ion-buttons>
      <ion-title>
        {{
          (geoHazard() === GeoHazard.Snow
            ? "REGISTRATION.SNOW.AVALANCHE_OBS.SET_AVALANCHE_POSITION"
            : "REGISTRATION.DIRT.LAND_SLIDE_OBS.SET_LANDSLIDE_POSITION"
          ) | translate
        }}
      </ion-title>
    </ion-toolbar>
  </ion-header>
}
<ion-content>
  @if (fromMarker) {
    <app-set-location-in-map
      [geoHazard]="geoHazard()"
      (mapReady)="onMapReady($event)"
      [fromMarker]="fromMarker"
      [locationMarker]="locationMarker"
      (locationTimeSet)="onLocationSet($event)"
      [locationPolygon]="locationPolygon"
      [confirmLocationText]="confirmLocationText"
      fromLocationText="REGISTRATION.OBS_LOCATION.TITLE"
      [showPreviousUsedLocations]="false"
      [locationTitle]="locationText"
      [showPolyline]="false"
      [setObsTime]="false"
      [locationMarkerIconUrl]="locationMarkerIconUrl"
    >
    </app-set-location-in-map>
  }
</ion-content>
