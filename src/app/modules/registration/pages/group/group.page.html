<ion-header>
  <ion-toolbar appHeaderColor>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title> {{ "REGISTRATION.GROUP.TITLE" | translate }} </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-registration-content-wrapper *ngIf="draft" [draft]="draft" [registrationTid]="registrationTid" (reset)="reset()">
    <ion-list lines="full">
      <ion-list-header class="ion-text-uppercase">
        <ion-label> {{ "REGISTRATION.GROUP.SUBTITLE" | translate }} </ion-label>
      </ion-list-header>
      <ion-radio-group
        *ngIf="groups.length > 1"
        [ngModel]="draft.registration.ObserverGroupID"
        (ngModelChange)="groupChanged($event)"
      >
        @for (group of groups; track group.Id) {
          <ion-item>
            <ion-radio [value]="group.Id" labelPlacement="end" justify="start">
              {{ group.Name }}
            </ion-radio>
          </ion-item>
        }
      </ion-radio-group>
      <ion-item *ngIf="groups.length === 1">
        <ion-checkbox [checked]="isSelected" (ionChange)="checkedChanged($event)" labelPlacement="end" justify="start">
          {{ firstGroup.Name }}
        </ion-checkbox>
      </ion-item>
    </ion-list>
  </app-registration-content-wrapper>
</ion-content>
