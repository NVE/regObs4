<ion-header>
  <ion-toolbar appHeaderColor>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">{{ "DIALOGS.CANCEL" | translate }}</ion-button>
    </ion-buttons>
    <ion-title> {{ "REGISTRATION.SNOW.SNOW_PROFILE.COMPRESSION_TEST.TITLE" | translate }} </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form (ngSubmit)="ok()">
    <app-compression-test-list
      *ngIf="draft"
      [tests]="tests()"
      (testsChange)="save($event)"
      [includeInSnowProfileAsDefault]="true"
    ></app-compression-test-list>
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="6" offset="3">
          <ion-button type="submit" expand="block" fill="solid" color="primary">
            {{ "DIALOGS.OK" | translate }}
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
