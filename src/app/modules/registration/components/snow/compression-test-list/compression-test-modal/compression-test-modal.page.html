<ion-header>
  <ion-toolbar appHeaderColor>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">{{ "DIALOGS.CANCEL" | translate }}</ion-button>
    </ion-buttons>
    <ion-title>{{ "REGISTRATION.SNOW.COMPRESSION_TEST.TITLE" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="full">
    <ion-item>
      <ion-toggle [disabled]="isLBT()" [(ngModel)]="includeInSnowProfile" name="IncludeInSnowProfile">
        {{ "REGISTRATION.SNOW.SNOW_PROFILE.COMPRESSION_TEST.INCLUDE_IN_SNOW_PROFILE" | translate }}
      </ion-toggle>
    </ion-item>
    <app-kdv-select
      label="REGISTRATION.SNOW.COMPRESSION_TEST.TEST_TYPE"
      kdvKey="Snow_PropagationKDV"
      [(value)]="propagationTid"
    >
    </app-kdv-select>
    <ion-item *ngIf="tapsFractureVisible()">
      <app-select
        [label]="
          isRB() ? 'REGISTRATION.SNOW.COMPRESSION_TEST.RB_SCORE' : 'REGISTRATION.SNOW.COMPRESSION_TEST.TAPS_FRACTURE'
        "
        [(selectedValue)]="tapsFracture"
        [options]="tapsArray()"
        label="REGISTRATION.SNOW.COMPRESSION_TEST.TAPS_FRACTURE"
      ></app-select>
    </ion-item>
    <app-numeric-input
      *ngIf="!isCTNorECTXorRB7() && propagationTid() != null"
      [(value)]="fractureDepth"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.DISTANCE_FROM_TOP"
      [min]="0"
      [max]="999"
      [decimalPlaces]="0"
      [convertRatio]="100"
      suffix="cm"
    ></app-numeric-input>
    <app-numeric-input
      *ngIf="isPST()"
      [(value)]="pstX"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.X_DISTANCE"
      [min]="0"
      [max]="999"
      [decimalPlaces]="0"
      [convertRatio]="100"
      suffix="cm"
    ></app-numeric-input>
    <app-numeric-input
      *ngIf="isPST()"
      [(value)]="pstY"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.Y_DISTANCE"
      [min]="0"
      [max]="999"
      [decimalPlaces]="0"
      [convertRatio]="100"
      suffix="cm"
    ></app-numeric-input>
    <app-numeric-input
      *ngIf="rbReleaseVisible()"
      [(value)]="rbRelease"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.RB_RELEASE"
      [min]="0"
      [max]="100"
      [decimalPlaces]="0"
      suffix="%"
    >
    </app-numeric-input>
    <app-kdv-select
      *ngIf="testFractureVisible()"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.FRACTURE_TYPE"
      kdvKey="Snow_ComprTestFractureKDV"
      [(value)]="comprTestFractureTid"
    ></app-kdv-select>
    <app-kdv-select
      *ngIf="!isLBT() && propagationTid() != null"
      label="REGISTRATION.SNOW.COMPRESSION_TEST.STABILITY_EVAL"
      kdvKey="Snow_StabilityEvalKDV"
      [(value)]="stabilityEvalTid"
    ></app-kdv-select>
    <app-text-comment label="REGISTRATION.DANGER_OBS.COMMENT" [(value)]="comment"> </app-text-comment>
  </ion-list>
  <app-modal-save-or-delete-buttons
    [saveDisabled]="!isValid()"
    (saveClicked)="ok()"
    (deleteClicked)="delete()"
    [showDelete]="showDelete()"
  >
  </app-modal-save-or-delete-buttons>
</ion-content>
