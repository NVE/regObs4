<ion-list lines="full">
  <ion-list-header class="ion-text-uppercase">
    <ion-label>
      {{ "REGISTRATION.SNOW.COMPRESSION_TEST.TITLE" | translate }}
    </ion-label>
  </ion-list-header>

  @for (item of testsWithLabel(); track $index; let i = $index) {
    <ion-item
      tabindex="0"
      detail="true"
      (click)="addOrEditCompressionTest(i)"
      (keyup.enter)="addOrEditCompressionTest(i)"
      button
    >
      <ion-label>
        {{ item.label }}
        @if (item.test.Comment) {
          <ion-note color="medium">{{ item.test.Comment }}</ion-note>
        }
      </ion-label>
      @if (item.test.IncludeInSnowProfile) {
        <ion-icon slot="end" name="link"></ion-icon>
      }
    </ion-item>
  }

  <ion-item tabindex="0" (click)="addOrEditCompressionTest()" (keyup.enter)="addOrEditCompressionTest()" button>
    <ion-icon color="primary" name="add-circle-outline" slot="start"></ion-icon>
    <ion-label>{{ "REGISTRATION.SNOW.COMPRESSION_TEST.ADD_NEW" | translate }}</ion-label>
  </ion-item>
</ion-list>
