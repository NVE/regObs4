<ion-list lines="full">
  <app-edit-images-bar [registrationTid]="10" modalTitlePostfix="GEO_HAZARDS.WATER"></app-edit-images-bar>

  <app-text-comment
    label="DIALOGS.COMMENT"
    placeholder="REGISTRATION.GENERAL_COMMENT.COMMENT_PLACEHOLDER"
    [(value)]="comment"
  ></app-text-comment>

  <app-add-web-url-item [(weburls)]="urls"></app-add-web-url-item>

  <ion-item (click)="nav()">
    <ion-label>
      <h2 class="ion-label-fat">
        {{ "REGISTRATION.WATER.WATER_LEVEL.SET_FLOOD_POSITION_SUMMARY_TITLE" | translate }}
      </h2></ion-label
    >
    <ion-text color="medium" class="ion-align-self-start ion-text-wrap"> </ion-text>
    <ion-icon *ngIf="waterExtent()" slot="end" color="success" name="checkmark-circle"></ion-icon>
    <ion-icon slot="end" class="item-detail-icon" name="chevron-forward"> </ion-icon>
  </ion-item>
</ion-list>
