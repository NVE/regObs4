<ion-grid class="pull-last-bottom ion-no-padding ion-no-margin">
  <ion-row>
    <ion-col class="ion-no-padding">
      <ng-content></ng-content>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class="ion-no-padding">
      @let d = draft();
      @if (registrationTid(); as tid) {
        <app-help-text [registrationTid]="tid" [geoHazard]="d.registration.GeoHazardTID"></app-help-text>
      }
      <app-navigation-buttons [draft]="d"></app-navigation-buttons>
      <app-save-and-go-back-button [draft]="d" (reset)="emitReset()"></app-save-and-go-back-button>
    </ion-col>
  </ion-row>
</ion-grid>
