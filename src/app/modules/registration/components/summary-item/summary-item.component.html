@if (!(readonly() && !item().hasData)) {
  <ion-item class="summary-item" (click)="navigate()" [detail]="!readonly()" [button]="!readonly()">
    <ion-label class="ion-padding-vertical ion-padding-end">
      <h2 [ngClass]="{ 'ion-label-fat': simpleObsMode() }">{{ item().title | translate }}</h2>
      @if (item().subTitle; as subTitle) {
        <p [ngClass]="{ 'simple-mode-sub': simpleObsMode() }">
          {{ subTitle | translate }}
        </p>
      }
      <app-thumbnails [attachments]="item().attachments"></app-thumbnails>
    </ion-label>
    @if (item().hasData && !readonly()) {
      <ion-icon slot="end" color="success" name="checkmark-circle"></ion-icon>
    }
  </ion-item>
}
