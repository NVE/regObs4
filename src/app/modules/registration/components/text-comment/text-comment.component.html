<ion-item detail="false">
  <ion-textarea
    [label]="label() | translate | uppercase"
    labelPlacement="stacked"
    autocapitalize="sentences"
    [maxlength]="max()"
    [disabled]="disabled()"
    type="textarea"
    (ionBlur)="onBlur()"
    [rows]="rows()"
    [(ngModel)]="value"
    [autoGrow]="true"
    placeholder="{{ placeholder() | translate }}"
  ></ion-textarea>
</ion-item>
