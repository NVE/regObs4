<ion-accordion>
  <ion-item slot="header" color="light">
    <app-header-with-selected-items titleKey="MENU.TIMESPAN">
      @if (useDaysBack()) {
        @if (daysBack() !== undefined) {
          <app-check-days-or-weeks-back [daysBack]="daysBack()!"></app-check-days-or-weeks-back>
        }
      } @else {
        {{ dateRangeText() }}
      }
    </app-header-with-selected-items>
  </ion-item>
  <ion-list lines="full" slot="content">
    <!-- Hurtigvalg på dager tilbake -->
    <ion-item>
      <app-observations-days-back
        [labelKey]="'Hurtigvalg'"
        (daysBackChange)="setUseDaysBack($event)"
      ></app-observations-days-back>
    </ion-item>

    <!-- Startdato -->
    <ion-item>
      <ion-label slot="start">{{ "MENU.START_DATE" | translate }}</ion-label>
      <app-datetime-picker
        presentation="date"
        [dateTime]="fromDate()"
        [minDate]="minDate"
        [maxDate]="toDate() || maxDate"
        (dateTimeChange)="setFromDate($event)"
        [dateFormat]="dateFormat"
      ></app-datetime-picker>
    </ion-item>

    <!-- Sluttdato -->
    <ion-item>
      <ion-label slot="start">{{ "MENU.END_DATE" | translate }}</ion-label>
      <app-datetime-picker
        presentation="date"
        [dateTime]="toDate()"
        [minDate]="fromDate() || minDate"
        [maxDate]="maxDate"
        (dateTimeChange)="setToDate($event)"
        [dateFormat]="dateFormat"
      ></app-datetime-picker>
    </ion-item>
  </ion-list>
</ion-accordion>
