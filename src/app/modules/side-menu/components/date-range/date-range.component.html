<ion-accordion-group *ngIf="!isNativePlatform; else observationsDaysBackOnly" (ionChange)="toggleAccordion($event)">
  <ion-accordion value="first">
    <ion-item slot="header" color="light">
      <ion-label color="dark" position="stacked">
        {{ "MENU.TIMESPAN" | translate }}
      </ion-label>
      <ng-container *ngIf="useDaysBack(); else showDateRange">
        <ng-container>
          <ion-text *ngIf="!isOpen" class="ion-align-self-start">
            <app-check-days-or-weeks-back
              *ngIf="userSettingService.daysBackForCurrentGeoHazard$ | async as daysBack"
              [daysBack]="daysBack"
            ></app-check-days-or-weeks-back>
          </ion-text>
        </ng-container>
      </ng-container>
    </ion-item>
    <div slot="content">
      <ion-list *ngIf="mode() as modeValue">
        <ion-radio-group [value]="modeValue" (ionChange)="changeMode($event)">
          <ion-item>
            <ion-radio slot="start" value="predefined"></ion-radio>
            <app-observations-days-back (changeDaysBack)="setUseDaysBack($event)"></app-observations-days-back>
          </ion-item>

          <ion-item>
            <ion-radio slot="start" value="custom" labelPlacement="end">{{
              "MENU.CUSTOM_TIMESPAN" | translate
            }}</ion-radio>
          </ion-item>

          <ion-item class="white-background" *ngIf="modeValue === 'custom'">
            <ion-label slot="start">{{ "MENU.START_DATE" | translate }}</ion-label>
            <app-datetime-picker
              presentation="date"
              [dateTime]="fromDate()"
              [minDate]="minDate"
              [maxDate]="toDate() || maxDate"
              (dateTimeChange)="setFromDate($event)"
              [dateFormat]="dateFormat"
            ></app-datetime-picker>
          </ion-item>

          <ion-item class="white-background" *ngIf="modeValue === 'custom'">
            <ion-label slot="start">{{ "MENU.END_DATE" | translate }}</ion-label>
            <app-datetime-picker
              presentation="date"
              [dateTime]="toDate()"
              [minDate]="fromDate() || minDate"
              [maxDate]="maxDate"
              (dateTimeChange)="setToDate($event)"
              [dateFormat]="dateFormat"
            ></app-datetime-picker>
          </ion-item>
        </ion-radio-group>
      </ion-list>
    </div>
  </ion-accordion>
</ion-accordion-group>

<ng-template #showDateRange>
  <ng-container *ngIf="dateRangeText() as dateText">
    <ion-text *ngIf="!isOpen" class="ion-align-self-start">
      <span>{{ dateText }}</span>
    </ion-text>
  </ng-container>
</ng-template>

<ng-template #observationsDaysBackOnly>
  <app-observations-days-back (changeDaysBack)="setUseDaysBack($event)"></app-observations-days-back>
</ng-template>
