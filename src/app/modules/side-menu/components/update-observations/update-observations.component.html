<ion-item (click)="refresh()" lines="full" button detail="false" color="light">
  <ion-label>{{ "MENU.UPDATE_OBSERVATIONS" | translate }}</ion-label>
  <!--ng-container *ngIf="!(isLoading$ | async); else isLoadingTemplate"-->
  <ion-text *ngIf="lastFetched$ | async as lastFetched; else noLastFetched">
    {{ lastFetched | date: settings.dateFormats.angular.dateAndTime }}
  </ion-text>
  <ion-icon name="refresh" slot="end"></ion-icon>
</ion-item>
<ng-template #isLoadingTemplate>
  <ion-text class="ion-align-self-start">
    <ion-spinner name="dots"></ion-spinner>
  </ion-text>
</ng-template>
<ng-template #noLastFetched>
  <ion-text class="ion-align-self-start">-</ion-text>
</ng-template>
