<ion-label>
  <ng-content></ng-content>
  @if (selectedItemsCount() == 0) {
    <span>
      {{ "OBSERVATION_FILTER.MULTISELECT_SHOW_NO_COUNT" | translate }}
    </span>
  } @else {
    <span>
      {{ "OBSERVATION_FILTER.MULTISELECT_SHOW_COUNT" | translate: { selectedItemsCount: selectedItemsCount() } }}
    </span>
  }
</ion-label>
