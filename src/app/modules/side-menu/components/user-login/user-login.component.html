<ng-container *ngIf="!isLoggingIn; else spinner">
  <ion-item *ngIf="!loggedInUser.isLoggedIn" (click)="login()" detail="true" button="true" color="light">
    <ion-icon slot="start" name="person-circle-outline" color="primary"></ion-icon>
    <ion-label class="menu-label">
      {{ "LOGIN.TITLE" | translate }}
    </ion-label>
  </ion-item>
  <ng-container *ngIf="loggedInUser.isLoggedIn">
    <ion-item (click)="storeCurLocation()" routerLink="/login" routerDirection="forward" detail="true" color="light">
      <ion-icon slot="start" name="person-circle-outline" color="primary"></ion-icon>
      <ion-label class="menu-label">
        {{ loggedInUser.email }}
      </ion-label>
    </ion-item>
    <ion-item routerLink="/my-observations" routerDirection="forward" detail="true" color="light">
      <ion-icon slot="start" name="eye-outline" color="primary"></ion-icon>
      <ion-label class="menu-label">
        {{ "MY_OBSERVATIONS.TITLE" | translate }}
      </ion-label>
    </ion-item>
  </ng-container>
</ng-container>
<ng-template #spinner>
  <ion-item>
    <ion-text>
      <ion-spinner name="dots"></ion-spinner>
    </ion-text>
  </ion-item>
</ng-template>
