<ion-fab slot="fixed" vertical="top" horizontal="start" id="geo-fab-btn">
  <ion-fab-button>
    <!-- <app-geo-icon [geoHazards]="currentGeohazard()"></app-geo-icon> -->
    <ion-icon [src]="geohazard().icon"></ion-icon>
  </ion-fab-button>
</ion-fab>
<ion-popover
  trigger="geo-fab-btn"
  size="auto"
  [dismissOnSelect]="true"
  reference="trigger"
  side="bottom"
  alignment="end"
>
  <ng-template>
    <ion-content>
      <ion-list>
        @for (option of geohazardOptions(); track option.id) {
          <ion-item
            button
            [detail]="false"
            [disabled]="option.isDisabled"
            (click)="setCurrentGeoHazard(option.geohazards)"
          >
            <!-- <app-geo-icon [geoHazards]="option.geohazards"></app-geo-icon> -->
            <ion-icon [src]="option.icon" slot="start"></ion-icon>
            <app-geo-name [geoHazards]="option.geohazards"></app-geo-name>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
