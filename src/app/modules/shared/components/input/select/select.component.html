<ion-button
  class="open-actionsheet"
  role="combobox"
  aria-expanded="false"
  aria-haspopup="dialog"
  expand="full"
  type="button"
  fill="clear"
  (click)="openSelect()"
>
</ion-button>
<div class="select">
  <div class="select__inner">
    <ion-label color="medium" position="stacked">
      {{ label() | translate }}
    </ion-label>
    <div class="select__icon-text">
      @if (valueIcon()) {
        <ion-icon class="value-icon" [src]="valueIcon()"></ion-icon>
      }
      @if (valueText()) {
        <ion-text>
          {{ valueText() | translate }}
        </ion-text>
      }
    </div>
  </div>
  <ion-icon class="select-icon" slot="end" name="caret-down-sharp"></ion-icon>
</div>
