<ion-header>
  <ion-toolbar>
    <form (ngSubmit)="doSearch()">
      <ion-list lines="none" class="ion-no-padding ion-no-margin">
        <ion-item>
          <ion-icon slot="start" name="search"></ion-icon>
          <ion-input
            placeholder="{{ 'MAP_SEARCH.SEARCH_TEXT' | translate }}"
            [formControl]="searchField"
            (ionBlur)="doSearch()"
          ></ion-input>
          <ion-icon slot="end" name="close" (click)="closeModal()"></ion-icon>
        </ion-item>
      </ion-list>
    </form>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list lines="full" class="search-result">
    @for (item of searchResults(); track item) {
      <ion-item (click)="searchItemClicked(item)" button>
        <ion-label>
          <ion-text class="search-result-name" [innerHTML]="item.name | startsWithHighlight: searchText()"></ion-text>
          <ion-text color="medium" class="search-description">{{ item.description }}</ion-text>
        </ion-label>
      </ion-item>
    }
  </ion-list>
  @if (showHistory()) {
    <ion-list lines="full" class="search-result">
      <ion-list-header class="ion-text-uppercase">
        <ion-label>{{ "MAP_SEARCH.SEARCH_HISTORY_HEADER" | translate }}</ion-label>
      </ion-list-header>
      @for (item of searchHistory(); track item) {
        <ion-item (click)="searchItemClicked(item)" button>
          <ion-icon slot="start" name="time"></ion-icon>
          <ion-label>
            <ion-text class="search-result-name">{{ item.name }}</ion-text>
            <ion-text color="medium" class="search-description">{{ item.description }}</ion-text>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
