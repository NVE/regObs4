<!-- Shows brief info from one observation not saved on server -->
<ion-item
  lines="full"
  [detail]="!isLoading()"
  [routerLink]="'/registration/edit/' + draft().uuid"
  [disabled]="isLoading()"
>
  <!-- GeoHazard Icon -->
  <div slot="start" class="geo-icon-circle">
    <app-geo-icon [geoHazards]="[draft().registration.GeoHazardTID]"></app-geo-icon>
  </div>

  <!-- Registration draft title -->
  <ion-label>
    <h2>
      {{ locationName() }}
    </h2>
    <p class="ion-text-wrap">
      <ion-icon name="calendar"></ion-icon> {{ draft().registration.DtObsTime | formatDate | async }}
      @if (isDraft()) {
        <span> - {{ "DRAFT" | translate }}</span>
      }
    </p>
  </ion-label>

  <!-- Show error icon if the app failed to post this draft -->
  @if (isLoading()) {
    <!-- Show loading spinner if this draft is being posted right now -->
    <ion-spinner slot="end"></ion-spinner>
  } @else if (draft().error != null) {
    <ion-icon slot="end" [name]="getErrorIconName(draft().error)"></ion-icon>
  }
</ion-item>
