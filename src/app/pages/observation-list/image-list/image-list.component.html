<!-- En liste av bilder fra observasjoner, organisert i tabellform -->
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh()"> </ion-refresher>

  <div class="list-header">
    <p>{{ "OBSERVATION_LIST.IMAGES_DESCRIPTION" | translate }}</p>
    <app-list-controls pageType="images"></app-list-controls>
  </div>

  @if (isLoading()) {
    <div class="list__spinner">
      <ion-spinner></ion-spinner>
      <p>{{ "OBSERVATION_LIST.LOADING" | translate }}</p>
    </div>
  }
  <div class="grid" [class.list--hidden]="isLoading()">
    @for (reg of registrations(); track reg.RegId) {
      @for (attachment of reg.Attachments; track attachment.AttachmentId) {
        <app-grid-image
          [attachment]="attachment"
          (click)="openImageCarousel(attachment.Url, reg.RegId, reg.Attachments)"
        ></app-grid-image>
      }
    } @empty {
      @if (error().hasError) {
        <app-error-state></app-error-state>
      } @else {
        <app-empty-state></app-empty-state>
      }
    }
  </div>

  <ion-infinite-scroll (ionInfinite)="loadNextPage()" [disabled]="disableInfiniteScroll()">
    <ion-infinite-scroll-content> </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
