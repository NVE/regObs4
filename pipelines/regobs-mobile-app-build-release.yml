# Bygger og deployer Regobs mobil app til App Store og Google Play

# Ikke start denne pipelinen på vanlige branch triggers eller PR trigger
trigger: none
pr: none

# Kjør pipeline hver natt
schedules:
  - cron: '0 0 * * *'
    displayName: Release hver natt
    branches:
      include:
        - develop
    always: false # Ikke kjør om ikke det er endringer på develop
    batch: true # Ikke start basert på cron om pipeline allerede kjører

variables:
  - group: regobs
  - group: sentryProperties

pool:
  vmImage: 'macos-26'
  demands: xcode

steps:
  #- script: '/bin/bash -c "sudo xcode-select -s /Applications/Xcode_11.2.1.app/Contents/Developer"'
  #  displayName: 'Set Xcode version 11.2.1'
  #  enabled: false

  # jolokv: Commented out installation of dev stuff.
  # Can be removed if pipeline runs OK later.
  # - task: InstallAppleCertificate@2
  #   displayName: 'Install Apple development certificate'
  #   inputs:
  #     certSecureFile: 'be7635ac-272e-49ca-9c52-329ecd19cfb3'
  #     certPwd: '$(apple_dev_cert)'

  # - task: InstallAppleProvisioningProfile@1
  #   displayName: 'Install an Apple Development provisioning profile'
  #   inputs:
  #     provProfileSecureFile: 'c72d2dec-35b3-4566-a822-6cf9894bd00e'

  - task: InstallAppleCertificate@2
    displayName: 'Install Apple App Store distribution certificate'
    inputs:
      certSecureFile: 'apple-distribution-2025-12-11.p12'
      certPwd: '$(apple.dist.cert.password_nov2025)'

  - task: InstallAppleProvisioningProfile@1
    displayName: 'Install an Apple App Store distribution provisioning profile'
    inputs:
      provProfileSecureFile: 'appledistribution20251211.mobileprovision'

  - task: NodeTool@0
    displayName: 'Use Node 20.x'
    inputs:
      versionSource: 'spec'
      versionSpec: 20.x
      checkLatest: false

  - task: Npm@1
    displayName: 'Update npm to v11'
    inputs:
      command: custom
      customCommand: 'install -g npm@11'

  # Needed to sign Android apk/aab
  - task: DownloadSecureFile@1
    displayName: 'Download secure file: nve.keystore'
    inputs:
      secureFile: '3a7f7301-2d1f-419c-b23b-2b72418bc324'
      retryCount: 5

  #- task: DownloadSecureFile@1
  #  displayName: 'Download secure file: build.json'
  #  inputs:
  #    secureFile: 'c5491b5c-2fb9-4018-b1b5-aedbc42c4cf3'
  #    retryCount: 5

  - task: DownloadSecureFile@1
    displayName: 'Download secure file: apikey.json'
    inputs:
      secureFile: '8a4eb7ac-653f-40c8-a421-d0a145352828'
      retryCount: 5

  - task: CopyFiles@2
    displayName: 'Copy Files to: ./'
    inputs:
      SourceFolder: '$(Agent.TempDirectory)'
      Contents: |
        nve.keystore
        build.json
        sentry.properties
      TargetFolder: ./

  - task: CopyFiles@2
    displayName: 'Copy apikey.json to: ./src/assets'
    inputs:
      SourceFolder: '$(Agent.TempDirectory)'
      Contents: apikey.json
      TargetFolder: ./src/assets

  #- script: 'echo "##vso[task.setvariable variable=NODE_OPTIONS]--max_old_space_size=8048"'
  #  displayName: 'Set NODE_OPTIONS=--max_old_space_size=8048'

  - task: Npm@1
    displayName: 'npm install'
    inputs:
      command: ci
      verbose: false

  - task: Npm@1
    displayName: 'Add nn app translation fallback values from nb'
    inputs:
      command: custom
      verbose: false
      customCommand: 'run translations:add-nn-app-fallback'

  - task: Npm@1
    displayName: 'npm create version file and update AndroidManifest.xml and plist.info'
    inputs:
      command: custom
      verbose: false
      customCommand: 'run create-version-file'

  - task: Npm@1
    displayName: 'npm build production'
    inputs:
      command: custom
      verbose: false
      customCommand: 'run build:prod'

  - task: oneLuckiDevJson2Variable@1
    displayName: 'Create environment variables from version.json file'
    inputs:
      jsonFile: '$(Build.SourcesDirectory)/src/environments/version.json'
      shouldPrefixVariables: true

  - task: Npm@1
    displayName: 'Create Sentry release'
    inputs:
      command: custom
      customCommand: 'run sentry:release:new'
    env:
      RELEASE: app@$(json.version)

  - task: Npm@1
    displayName: 'Set commits on Sentry release'
    inputs:
      command: custom
      customCommand: 'run sentry:release:commits'
    env:
      RELEASE: app@$(json.version)

  - task: Npm@1
    displayName: 'Inject source maps'
    inputs:
      command: custom
      customCommand: 'run sentry:sourcemaps:inject'

  - task: Npm@1
    displayName: 'Upload source maps to Sentry'
    inputs:
      command: custom
      customCommand: 'run sentry:sourcemaps:upload'
    env:
      RELEASE: app@$(json.version)
      DIST: $(json.revision)

  - task: Npm@1
    displayName: 'Finalize Sentry release'
    inputs:
      command: custom
      customCommand: 'run sentry:release:finalize'
    env:
      RELEASE: app@$(json.version)

  - task: Npm@1
    displayName: 'Delete source maps before copying to native apps'
    inputs:
      command: custom
      customCommand: 'run sourcemaps:clean'

  - task: Npm@1
    displayName: 'Capacitor sync to native folders'
    inputs:
      command: custom
      verbose: false
      customCommand: 'run cap:sync'

  # TODO: Create ipa
  - task: Xcode@5
    inputs:
      actions: 'build'
      configuration: 'Release'
      sdk: 'iphoneos'
      xcodeVersion: '16'
      xcWorkspacePath: '$(system.defaultworkingdirectory)/ios/App/App.xcworkspace'
      scheme: 'App'
      packageApp: true
      archivePath: '$(system.defaultworkingdirectory)/ios/build/outputs'
      exportPath: 'output/iphoneos/Release'
      exportOptions: 'auto'
      signingOption: 'manual'
      #signingIdentity: 'iPhone Distribution'
      #provisioningProfileUuid: 'c996749d-5726-486d-b0ad-01937768b6b1'
      #provisioningProfileName: 'regobs-dist-2023-11-01'
      teamId: '43L5B5X2PE'
      signingIdentity: '$(APPLE_CERTIFICATE_SIGNING_IDENTITY)'
      provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'

  - task: JavaToolInstaller@1
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - task: Gradle@4
    displayName: 'Create Android app bundle'
    inputs:
      gradleWrapperFile: 'android/gradlew'
      workingDirectory: 'android/'
      tasks: 'bundleRelease'
      publishJUnitResults: false
      javaHomeOption: 'JDKVersion'

  - task: CmdLine@2
    inputs:
      script: 'jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore nve.keystore -storepass $(android.keystore.password) -keypass $(android.keystore.password) $(system.defaultworkingdirectory)/android/app/build/outputs/bundle/release/*.aab regobs'

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(build.artifactStagingDirectory)'
    inputs:
      Contents: |
        android/app/build/outputs/bundle/release/*.aab
        output/iphoneos/Release/*.ipa
      TargetFolder: '$(build.artifactStagingDirectory)'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
